name: Feature request
description: Something MNN should do that it does not.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: The morning you want, before the feature you have in mind.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you would change
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead
      description: A source module, an inbox file or a staged edition can already do a lot. If you tried one, say where it fell short.
