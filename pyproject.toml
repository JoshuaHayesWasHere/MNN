[project]
name = "mnn"
version = "0.1.0"
description = "A daily newspaper written by your AI agent and delivered to your e-reader"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.11.0",
    "ebooklib>=0.20",
    "pillow>=12.3.0",
]

[project.scripts]
mnn-press = "mnn.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mnn"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
